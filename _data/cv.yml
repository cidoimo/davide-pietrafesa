        summary: "Supervisors: Prof. Mattia Falconi, Prof. Federico Iacovelli, Prof. Manuela Helmer-Citterich."
        highlights:
          - Scripting in Bash, Python and R; molecular docking with AutoDock Vina.
          - Modelling of biological membranes and protein-RNA/DNA complexes (AlphaFold2 and 3, RoseTTAFoldNA, D-I-TASSER); computational mutagenesis.
